name: 穿云 Windows

# 穿云 Windows x64 (fork of hiddify-app, GPLv3).
# Push to main / PR -> portable zip + installer as workflow artifacts, after smoke tests on the
# runner (tool/smoke: app launch/screenshots/single instance/tray, core gRPC token + 系统代理 +
# TUN with a local SOCKS test node, installer install/upgrade/uninstall).
# Push a tag v* -> also attach Chuanyun-Windows-x64-Setup.exe and Chuanyun-Windows-x64.zip to the
# GitHub Release of that tag (v*-win* tags are Windows-only test prereleases; the Android
# workflow skips them).
on:
  push:
    branches: [main, v1.4, 'rel-*']
    tags: ['v*']
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # 穿云 1.7.0: 兼容内核 (muse-compat.dll) from the core repository's source at the commit pinned in
  # dependencies.properties (muse.compat.ref, branch rel-1.7.0) — cross-built with MinGW like the
  # core repository's own CI. No core release is involved.
  compat-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: dependencies.properties
          sparse-checkout-cone-mode: false

      - name: Pinned core commit
        id: ref
        run: |
          ref=$(sed -n 's/^muse\.compat\.ref=\([0-9a-f]\{40\}\)$/\1/p' dependencies.properties)
          [ -n "$ref" ] || { echo "::error::dependencies.properties needs muse.compat.ref=<40-hex commit>"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          repository: yywgov/muse-core
          ref: ${{ steps.ref.outputs.ref }}
          path: core
          submodules: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: core/mihomo/go.mod
          cache-dependency-path: core/mihomo/go.sum
          check-latest: false

      - name: Setup MinGW
        timeout-minutes: 15
        run: |
          for i in 1 2 3; do
            sudo timeout 300 apt-get update -q && sudo timeout 400 apt-get install -y -q gcc-mingw-w64-x86-64 && break
            echo "::warning::mingw install attempt $i failed"; sleep 10
          done
          x86_64-w64-mingw32-gcc --version

      - name: Build muse-compat.dll
        working-directory: core/mihomo
        env:
          CGO_ENABLED: '1'
          GOOS: windows
          GOARCH: amd64
          CC: x86_64-w64-mingw32-gcc
        run: |
          tags=$(sed -n 's/^  MIHOMO_TAGS: \(.*\)$/\1/p' ../.github/workflows/mihomo.yml)
          ver=$(sed -n 's/^  MIHOMO_VERSION: \(.*\)$/\1/p' ../.github/workflows/mihomo.yml)
          echo "tags=$tags version=$ver"
          [ -n "$tags" ] && [ -n "$ver" ] || { echo "::error::could not read the build tags"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          go build -buildmode=c-shared -trimpath -tags "$tags" \
            -ldflags "-s -w -buildid= -X github.com/metacubex/mihomo/constant.Version=$ver" \
            -o "$GITHUB_WORKSPACE/out/muse-compat.dll" ./bridge

      - name: Check exports and record size
        working-directory: out
        run: |
          rm -f muse-compat.h
          x86_64-w64-mingw32-objdump -p muse-compat.dll | tr -d '\r' > /tmp/pe.txt
          sed -n '/Ordinal\/Name Pointer/,/^$/p' /tmp/pe.txt > /tmp/exports.txt
          for f in setup start stop restart freeString cleanup closeGrpc; do
            grep -qw -- "$f" /tmp/exports.txt || { echo "::error::muse-compat.dll does not export $f"; exit 1; }
          done
          b=$(stat -c %s muse-compat.dll)
          echo "### muse-compat.dll: $b bytes (core ${{ steps.ref.outputs.ref }})" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: muse-compat-dll
          path: out/muse-compat.dll
          retention-days: 3

  windows:
    needs: compat-core
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2.21.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # codegen + slang + prebuilt core (hiddify-lib-windows-amd64.tar.gz from yywgov/muse-core)
      - name: Prepare (codegen + prebuilt core)
        run: make windows-prepare

      - uses: actions/download-artifact@v4
        with:
          name: muse-compat-dll
          path: hiddify-core/bin

      - name: Core files present
        run: |
          ls -la hiddify-core/bin
          for f in hiddify-core.dll libcronet.dll muse-compat.dll; do
            test -f "hiddify-core/bin/$f" || { echo "missing $f"; exit 1; }
          done

      # Flutter 3.38's tool_backend.dart passes -dTreeShakeIcons="true" with literal quotes; on
      # Windows the quotes survive (flutter.bat -> dart), the define is not 'true' and the icon
      # fonts ship unshaken (~6 MB). Drop the quotes so release builds shake them like Android.
      - name: Enable icon tree shaking (Flutter tool_backend quoting bug)
        run: |
          fr="$(dirname "$(dirname "$(command -v flutter)")")"
          tb="$fr/packages/flutter_tools/bin/tool_backend.dart"
          sed -i 's/-dTreeShakeIcons="\$treeShakeIcons"/-dTreeShakeIcons=$treeShakeIcons/' "$tb"
          grep -n "dTreeShakeIcons" "$tb"

      - name: Build
        run: flutter build windows --release --target lib/main_prod.dart

      - name: Icon fonts shaken
        run: |
          ls -la build/windows/x64/runner/Release/data/flutter_assets/fonts/ || true
          find build/windows/x64/runner/Release/data/flutter_assets -name "*.ttf" -o -name "*.otf" | xargs ls -la

      - name: Package zip
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          Get-ChildItem $rel | Select-Object Name, Length
          if (-not (Test-Path "$rel\Chuanyun.exe")) { throw "Chuanyun.exe not found" }
          if (-not (Test-Path "$rel\hiddify-core.dll")) { throw "hiddify-core.dll not bundled" }
          if (-not (Test-Path "$rel\muse-compat.dll")) { throw "muse-compat.dll not bundled" }
          if (-not (Test-Path "$rel\ChuanyunGuard.exe")) { throw "ChuanyunGuard.exe not bundled" }
          foreach ($d in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")) {
            if (-not (Test-Path "$rel\$d")) { throw "$d not bundled (PCs without VC++ Redistributable cannot start the app)" }
          }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          New-Item -ItemType Directory -Path pkg -Force | Out-Null
          Copy-Item -Recurse $rel pkg\Chuanyun
          7z a -tzip out\Chuanyun-Windows-x64.zip .\pkg\Chuanyun
          Get-ChildItem out | Select-Object Name, Length

      # ---- smoke tests (no real node: a SOCKS5 test node inside core_smoke.dart) ----
      - name: Smoke test - app (portable build)
        id: smoke_app
        continue-on-error: true
        timeout-minutes: 16
        run: bash tool/smoke/retry.sh "app smoke" 2 powershell -NoProfile -ExecutionPolicy Bypass -File 'tool\smoke\app_smoke.ps1' -AppDir 'build\windows\x64\runner\Release' -Out smoke -Label portable -RepoDir .

      - name: Smoke test - core (token, 系统代理, TUN)
        id: smoke_core
        continue-on-error: true
        timeout-minutes: 14
        run: bash tool/smoke/retry.sh "core smoke" 2 dart run tool/smoke/core_smoke.dart --kind standard --dll build/windows/x64/runner/Release --work "$RUNNER_TEMP/coresmoke" --out smoke

      # 1.7.0: the same checks against 兼容内核 (muse-compat.dll)
      - name: Smoke test - core, 兼容内核 (token, 系统代理, TUN)
        id: smoke_core_compat
        continue-on-error: true
        timeout-minutes: 14
        run: bash tool/smoke/retry.sh "core smoke (compat)" 2 dart run tool/smoke/core_smoke.dart --kind compat --dll build/windows/x64/runner/Release --work "$RUNNER_TEMP/coresmoke-compat" --out smoke

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $cands = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
                     "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe", "$env:ProgramFiles\Inno Setup 7\ISCC.exe")
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress | Out-Null
            $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          Write-Host "ISCC: $iscc"
          $ver = ((Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value)
          $src = (Resolve-Path pkg\Chuanyun).Path  # clean copy, taken before the smoke tests ran
          $dst = (Resolve-Path out).Path
          & $iscc "/DAppVersion=$ver" "/DSourceDir=$src" "/DOutputDir=$dst" windows\packaging\inno\chuanyun.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }
          Get-ChildItem out | Select-Object Name, Length

      - name: Smoke test - installer (install, run, upgrade, uninstall)
        id: smoke_installer
        continue-on-error: true
        timeout-minutes: 22
        run: bash tool/smoke/retry.sh "installer smoke" 2 powershell -NoProfile -ExecutionPolicy Bypass -File 'tool\smoke\installer_smoke.ps1' -Setup 'out\Chuanyun-Windows-x64-Setup.exe' -Out smoke -RepoDir .

      # 1.2.1: connected in 系统代理 mode, then status stream lost / core stopped behind the app /
      # process suspended (sleep) / tray hide+restore / killed / crash exit / killed with its guard
      # -> reconnected, or the user's own proxy settings back and the internet working
      - name: Smoke test - recovery (never leave the PC offline)
        id: smoke_recovery
        continue-on-error: true
        timeout-minutes: 30
        run: bash tool/smoke/retry.sh "recovery smoke" 2 powershell -NoProfile -ExecutionPolicy Bypass -File 'tool\smoke\recovery_smoke.ps1' -AppDir 'build\windows\x64\runner\Release' -Out smoke -RepoDir .

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Chuanyun-Windows-smoke
          path: smoke/
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: Chuanyun-Windows-x64
          path: |
            out/Chuanyun-Windows-x64.zip
            out/Chuanyun-Windows-x64-Setup.exe
          retention-days: 14

      - name: Smoke gate
        run: |
          echo "app=${{ steps.smoke_app.outcome }} core=${{ steps.smoke_core.outcome }} core-compat=${{ steps.smoke_core_compat.outcome }} installer=${{ steps.smoke_installer.outcome }} recovery=${{ steps.smoke_recovery.outcome }}"
          # continue-on-error steps always *conclude* success (green in the UI); their real result
          # is the outcome. Name every failed one, as an annotation anyone can read.
          bad=0
          for x in "app:${{ steps.smoke_app.outcome }}" "core:${{ steps.smoke_core.outcome }}" \
                   "core-compat:${{ steps.smoke_core_compat.outcome }}" \
                   "installer:${{ steps.smoke_installer.outcome }}" "recovery:${{ steps.smoke_recovery.outcome }}"; do
            if [ "${x#*:}" != success ]; then echo "::error title=Smoke gate::${x%%:*} smoke ${x#*:}"; bad=1; fi
          done
          exit $bad

      # gh instead of action-gh-release: the Android workflow may create the same release at the
      # same moment, so create-or-upload with a few retries
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # 1.5.0 #208: checksum files next to the downloads (verify with sha256sum -c)
          (cd out && for f in Chuanyun-Windows-x64-Setup.exe Chuanyun-Windows-x64.zip; do sha256sum "$f" > "$f.sha256"; done)
          files="out/Chuanyun-Windows-x64-Setup.exe out/Chuanyun-Windows-x64.zip out/Chuanyun-Windows-x64-Setup.exe.sha256 out/Chuanyun-Windows-x64.zip.sha256"
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release upload "$TAG" $files --clobber -R "$GITHUB_REPOSITORY" && exit 0
            else
              gh release create "$TAG" $files $pre --verify-tag --title "$TAG" -R "$GITHUB_REPOSITORY" && exit 0
            fi
            sleep 20
          done
          exit 1
