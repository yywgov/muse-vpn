
plugins { 
    id "com.android.application" 
    id "org.jetbrains.kotlin.android" 
    id "dev.flutter.flutter-gradle-plugin" 
    id "com.google.protobuf" version "0.9.4" 
    id "com.squareup.wire" version "5.3.1"
}

wire {
    kotlin {
        android = true
    }
    protoPath {
        srcDir 'src/main/protos'
    }
    sourcePath {
        srcDir 'src/main/protos/'
        include '**'
    }
}


def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

boolean hasKeyStore = false

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    hasKeyStore = true
} else {
    println "+++"
    println "No keystore defined. The app will not be signed."
    println "Create a android/key.properties file with the following properties:"
    println "storePassword"
    println "keyPassword"
    println "keyAlias"
    println "storeFile"
    println "+++"
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')?: '1'

def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace 'com.hiddify.hiddify'
    testNamespace "test.com.hiddify.hiddify"
    compileSdkVersion 36
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.chuanyun.app"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        // 穿云 1.1.1: the UI is Chinese only; keep just zh + en of the AndroidX/AppCompat strings
        resourceConfigurations += ["zh", "en"]
    }

    // 穿云 1.1: arm64 only through ndk.abiFilters (below); AGP rejects ABI splits next to them

    // 穿云 1.2.4: every release is signed with the same key, so 「检查更新」 can always install over
    // the previous version. Before, CI fell back to each runner's throw-away debug key and every
    // build had a different signature (Android refuses such an update). key.properties (from CI
    // secrets) still wins when present; otherwise the fixed project key below is used.
    signingConfigs {
        release {
            if (hasKeyStore) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            } else {
                storeFile file('chuanyun-release.p12')
                storeType 'pkcs12'
                storePassword 'chuanyun-release-2026'
                keyAlias 'chuanyun'
                keyPassword 'chuanyun-release-2026'
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
        // 穿云 1.1: arm64 only. The Flutter Gradle plugin puts all three ABIs into every build
        // type's ndk.abiFilters; replace them (not add).
        // 1.2.1: the emulator end-to-end job (x86_64) sets MUSE_E2E_ABI; release builds never do.
        configureEach { buildType ->
            buildType.ndk.abiFilters.clear()
            buildType.ndk.abiFilters.add(System.getenv("MUSE_E2E_ABI") ?: "arm64-v8a")
        }
    }

    buildFeatures {
        viewBinding true
        aidl true
    }

    packaging {
        jniLibs {
            // store native libs (mainly the Go core) compressed in the APK; Android extracts them
            // at install. Much smaller download, slightly larger installed size and install time.
            useLegacyPackaging = true
        }
    }

}

// 穿云 1.1.1: Emoji.ttf is the global font on Windows only (flag emojis); keep it out of the APK.
// Flutter registers fonts lazily and Android never asks for the "Emoji" family.
tasks.withType(Copy).configureEach { task ->
    if (task.name.startsWith("copyFlutterAssets")) {
        task.exclude("**/Emoji.ttf")
    }
}

android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        output.versionCodeOverride = android.defaultConfig.versionCode
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', '*.aar'])

    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation("com.squareup.wire:wire-grpc-client:5.3.1")

    implementation 'io.grpc:grpc-okhttp:1.64.0'
    implementation 'io.grpc:grpc-protobuf-lite:1.64.0'
    implementation 'io.grpc:grpc-stub:1.64.0'
//    protoPath(project(':hiddify_api'))
//    implementation project(':hiddify_api')




}
