name: hiddify
description: 穿云 - Android proxy client (fork of Hiddify, GPLv3).
publish_to: "none"
version: 1.22.0+220

environment:
  sdk: ^3.10.4
  # ! IMPORTANT !
  # This SDK version is strictly required and must not be removed.
  # It is parsed/grep-ed by Makefile and Dockerfile to configure the build environment.
  # Ensure this matches the target Flutter version.
  flutter: ^3.47.8
  
dependencies:
  flutter:
    sdk: flutter
  # Debug-only, like accessibility_tools: the two lib/main*.dart entrypoints
  # gate it behind kDebugMode, so release builds tree-shake it away.
  flutter_driver:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  crypto: ^3.0.6 # 穿云 1.2.2: SHA-256 check of downloaded updates
  pointycastle: ^3.9.1 # 穿云 1.4.0: AES-GCM for 同步 / 备份 files
  qr: ^3.0.2 # 穿云 1.4.0: QR codes for sharing a subscription

  # lucy_editor: ^1.0.5
  # re_highlight: ^0.0.3
  # json_editor_flutter: ^1.4.2

  slang: ^4.8.1
  slang_flutter: ^4.8.0
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  hooks_riverpod: ^2.4.10
  flutter_hooks: ^0.20.5
  riverpod_annotation: ^2.3.4
  rxdart: ^0.28.0
  drift: ^2.21.0
  drift_flutter: ^0.2.1
  shared_preferences: ^2.5.2
  # shared_preferences_android: ^2.4.8
  dio: ^5.4.1
  ffi: ^2.1.2
  path_provider: ^2.1.1
  mobile_scanner: ^7.2.0
  # protocol_handler: ^0.2.0
  flutter_native_splash: ^2.3.10
  share_plus: ^10.1.0
  window_manager: ^0.5.0
  tray_manager: ^0.5.0
  # get list of connected monitors (on Desktops), including their size and position
  screen_retriever: ^0.2.0

  package_info_plus: ^8.1.0

  url_launcher: ^6.2.5
  launch_at_startup: ^0.5.1
  hotkey_manager: 0.2.3 # 穿云 1.6.0 C8: global hotkeys (Windows only, MIT)
  sqlite3_flutter_libs: ^0.5.28

  path: ^1.9.0
  logging: ^1.3.0
  meta: ^1.15.0
  material_color_utilities: any
  dartx: ^1.2.0
  uuid: ^4.3.3
  accessibility_tools: ^2.2.3
  neat_periodic_task: ^2.0.1
  go_router: ^16.2.4
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  gap: ^3.0.1
  # percent_indicator_premium: ^0.0.2
  toastification: ^3.2.0
  version: ^3.0.2
  flutter_displaymode: ^0.6.0
  dio_smart_retry: ^7.0.1
  dart_mappable: ^4.2.1
  # permission_handler: ^11.3.0 # is not compatible with windows
  #flutter_easy_permission: ^1.1.2
  # flutter_easy_permission:
  #   git: https://github.com/MichaelStH/flutter_easy_permission.git
  fixnum: ^1.1.0
  # # for using protobuf install protoc from this link -> https://github.com/protocolbuffers/protobuf/releases
  # # then add path to "environment variable" e.g. -> C:\src\protoc-28.3-win64\bin
  # # then active "protoc_plugin" by running this command -> dart pub global activate protoc_plugin
  # # then add path to "environment variable" e.g. -> C:\Users\%USERPROFILE%\AppData\Local\Pub\Cache\global_packages\protoc_plugin\bin
  protobuf: ^5.0.0
  grpc: ^4.0.1
  flutter_typeahead: ^5.0.1
  # flutter_platform_widgets: ^7.0.1
  basic_utils: ^5.7.0
  text_scroll: ^0.2.0
  # platform-specific  settings
  # https://github.com/miguelpruivo/flutter_file_picker/wiki/Setup
  file_picker: ^8.1.7
  installed_apps: # ^1.5.2
    git: https://github.com/VB10/installed_apps

  # change case of text
  # for example camelCase to snake_case
  # helloWorld -> hello_worlds
  recase: ^4.1.0
  # Used for managing deep links on desktop platforms
  # platform-specific settings
  # https://github.com/llfbandit/app_links/tree/master/doc
  app_links: ^6.4.0
  # Used for registering custom schemes in the Windows registry
  win32: ^5.12.0
  humanizer: ^3.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.3.0
  build_web_compilers: ^4.0.11
  build_runner: ^2.4.13
  json_serializable: ^6.7.1
  freezed: ^2.4.7
  riverpod_generator: ^2.4.3
  drift_dev: ^2.21.0
  ffigen: ^19.1.0
  slang_build_runner: ^4.4.0
  flutter_gen_runner: ^5.4.0
  dart_mappable_builder: ^4.2.1
  # 穿云 1.19.3: test/features/muse/v1193_grpc_cancel_test.dart drives the transport directly
  http2: ^3.1.0
  # protoc_builder: ^0.4.1
  # google_protobuf: ^3.20.1;

# 穿云 1.19.3: grpc (up to 5.2.0) still pins http2 ^2.3.1, whose client killed the whole gRPC
# connection (PROTOCOL_ERROR, "Connection is being forcefully terminated. (errorCode: 1)") when
# the core's HEADERS for a stream the app had just cancelled arrived (listenSingle re-arming the
# log/status streams). 3.1.0 handles it (dart-lang/http #1799). That race made the start-up
# restore-connect fail now and then (started_by_user -> false; Windows recovery smoke
# restart-restores). Drop this override once grpc allows http2 ^3.1.0.
dependency_overrides:
  http2: ^3.1.0

flutter:
  uses-material-design: true
  assets:
    # - assets/core/geoip.db
    # - assets/core/geosite.db
    # 穿云 1.2.4: rule-sets the core starts from (no download wait on connect)
    - assets/rule-sets/
    # 穿云 1.9.0 #14: 兼容内核's default lists (.mrs), only those the default rules use
    - assets/rule-sets-compat/
    - assets/fonts/OFL-Inter.txt
    - assets/fonts/OFL-NotoSansSC.txt
    # 穿云 1.19.0 P1: 路由弧线图点阵底图（Natural Earth 公有领域，tool/world_dots/gen_world_dots.py 生成）
    - assets/map/world_dots.bin
    - assets/images/logo.svg
    - assets/images/glyph.svg
    - assets/images/tray_icon.ico
    - assets/images/tray_icon.png
    - assets/images/tray_icon_dark.ico
    - assets/images/tray_icon_dark.png
    - assets/images/tray_icon_connected.ico
    - assets/images/tray_icon_connected.png
    - assets/images/tray_icon_connecting.ico
    - assets/images/tray_icon_connecting.png
    - assets/images/tray_icon_disconnected.ico
    - assets/images/tray_icon_disconnected.png
    - assets/images/tray_icon_warning.ico
    - assets/images/tray_icon_warning.png

  fonts:
    # - family: Roboto
    #   fonts:
    #     - asset: assets/fonts/Roboto.ttf
    - family: Emoji
      fonts:
        - asset: assets/fonts/Emoji.ttf
    # 穿云 1.18.0 P7: Inter (SIL OFL 1.1, assets/fonts/OFL-Inter.txt), static instances subset to
    # Latin + digits + common symbols; Chinese falls back to the system font
    - family: MuseSans
      fonts:
        - asset: assets/fonts/MuseSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/MuseSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/MuseSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/MuseSans-Bold.ttf
          weight: 700
    # 穿云 1.19.2: 思源黑体 / Noto Sans SC (SIL OFL 1.1, assets/fonts/OFL-NotoSansSC.txt), subset to
    # GB2312 + every character in lib/ by tool/fonts/subset_cjk.py, renamed MuseHei (OFL: a modified
    # version takes another name); 400 + 600 — 500 falls back to 400, 700 to 600
    - family: MuseHei
      fonts:
        - asset: assets/fonts/MuseHei-Regular.ttf
          weight: 400
        - asset: assets/fonts/MuseHei-SemiBold.ttf
          weight: 600

flutter_gen:
  output: lib/gen/
  integrations:
    flutter_svg: true

flutter_native_splash:
  # 穿云 1.21.0 M13：底色跟随深浅色（浅 = 页面底 lightBgBottom，深 = darkBgBottom），源图是穿云圆形图标
  color: "#F6F8FC"
  color_dark: "#0B1222"
  image: assets/images/source/splash.png
  android_gravity: center
  android_12:
    color: "#F6F8FC"
    color_dark: "#0B1222"

ffigen:
  name: "HiddifyCoreNativeLibrary"
  description: "Bindings to Hiddify Core Library"
  output: "lib/gen/hiddify_core_generated_bindings.dart"
  headers:
    entry-points:
      - "hiddify-core/bin/desktop.h"

